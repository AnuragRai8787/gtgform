<!DOCTYPE html>
<html>
<head>
<title>Post-Session Clinical Input Form</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
}
.container {
    background: white;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    border-radius: 8px;
}
label {
    font-weight: bold;
    margin-top: 12px;
    display: block;
}
textarea, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}
button {
    margin-top: 15px;
    padding: 10px;
    width: 100%;
}
.warning {
    color: red;
    font-size: 14px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">
<h2>Post-Session Clinical Input Form</h2>

<form>

<!-- Billing Duration -->
<label>Billing Duration</label>
<input type="radio" name="duration" value="<15" onclick="setMBS()"> &lt; 15 minutes<br>
<input type="radio" name="duration" value="15" onclick="setMBS()"> 15 minutes<br>
<input type="radio" name="duration" value="30" onclick="setMBS()"> 30 minutes<br>
<input type="radio" name="duration" value="60" onclick="setMBS()"> 60 minutes<br>
<input type="radio" name="duration" value=">60" onclick="setMBS()"> &gt; 60 minutes<br>

<!-- MBS Item Number -->
<label>MBS Item Number</label>
<select id="mbs" onchange="checkMismatch()">
<option value="">-- Select --</option>
<option value="300">300</option>
<option value="302">302</option>
<option value="304">304</option>
<option value="306">306</option>
<option value="308">308</option>
<option value="291">291</option>
<option value="293">293</option>
<option value="296">296</option>
<option value="297">297</option>
<option value="91837">91837</option>
<option value="91839">91839</option>
</select>

<div id="warning" class="warning"></div>

<!-- Billing Arrangement -->
<label>Billing Arrangement</label>
<input type="radio" name="billing"> Bulk Bill<br>
<input type="radio" name="billing"> Private Bill<br>
<input type="radio" name="billing"> Private Health Insurance<br>

<!-- Follow-up Urgency -->
<label>Follow-up Urgency</label>
<input type="radio" name="urgency"> Urgent (48–72 hrs)<br>
<input type="radio" name="urgency"> Semi-urgent (2–3 weeks)<br>
<input type="radio" name="urgency"> Routine (4–6 weeks)<br>
<input type="radio" name="urgency"> Low Priority (≤90 days)<br>
<input type="radio" name="urgency"> Half-yearly (6 months)<br>
<input type="radio" name="urgency"> Yearly (12 months)<br>

<!-- Notes -->
<label>Other Notes</label>
<textarea placeholder="Enter notes..."></textarea>

<button type="submit">Submit</button>

</form>
</div>

<script>
const billingMap = {
    "<15": "300",
    "15": "302",
    "30": "304",
    "60": "306",
    ">60": "308"
};

function getSelectedDuration() {
    const radios = document.getElementsByName("duration");
    for (let r of radios) {
        if (r.checked) return r.value;
    }
    return null;
}

function setMBS() {
    const duration = getSelectedDuration();
    const mbsDropdown = document.getElementById("mbs");

    if (billingMap[duration]) {
        mbsDropdown.value = billingMap[duration]; // auto-set default
    }

    checkMismatch();
}

function checkMismatch() {
    const duration = getSelectedDuration();
    const selectedMBS = document.getElementById("mbs").value;
    const expectedMBS = billingMap[duration];
    const warning = document.getElementById("warning");

    if (duration && selectedMBS && expectedMBS !== selectedMBS) {
        warning.innerText = "⚠ Billing Duration and MBS Item Number do not match!";
    } else {
        warning.innerText = "";
    }
}
</script>

</body>
</html>
